server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy Core API and service via host-based routing
  location /api/ {
    proxy_pass http://host.docker.internal/;
    proxy_set_header Host api.berjis.tech;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /svc/ {
    proxy_pass http://host.docker.internal/;
    proxy_set_header Host schools-api.berjis.tech;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
