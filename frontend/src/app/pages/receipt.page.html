<div class="p-6 space-y-4" *ngIf="!loading && data as r">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold">Receipt</h2>
    <a routerLink="/purchases" class="text-blue-600">Back to purchases</a>
  </div>
  <div class="border rounded-xl p-5 bg-white shadow-sm">
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div><div class="text-slate-500">Course</div><div class="font-medium">{{ r.title }}</div></div>
      <div><div class="text-slate-500">Status</div><div class="font-medium uppercase">{{ r.status }}</div></div>
      <div><div class="text-slate-500">Amount</div><div class="font-medium">{{ (r.price / 100) | currency:r.currency }}</div></div>
      <div><div class="text-slate-500">Date</div><div class="font-medium">{{ r.createdAt || r.created_at | date:'medium' }}</div></div>
    </div>
  </div>
</div>
