<div class="p-4 space-y-3">
  <div class="flex items-center justify-between">
    <h2 class="mt-0 text-lg font-semibold">Courses</h2>
    <a routerLink="/course/create" class="px-3 py-2 rounded bg-gray-900 text-white">Create Course</a>
  </div>
  <div *ngIf="loading">Loading…</div>
  <div *ngIf="!loading && courses.length===0" class="text-sm text-gray-600">No courses yet.</div>
  <div class="divide-y">
    <div *ngFor="let c of courses" class="py-3 flex items-center justify-between">
      <div>
        <div class="font-medium">{{ c.title || c.name }}</div>
        <div class="text-xs text-gray-600">{{ c.description }}</div>
      </div>
      <div class="flex items-center gap-3">
        <div *ngIf="c.isPaid" class="text-sm">KES {{ (c.priceCents ?? 0) / 100 | number:'1.2-2' }}</div>
        <a [routerLink]="['/course', c.id]" class="px-3 py-1 rounded border">Open</a>
      </div>
    </div>
  </div>
</div>
