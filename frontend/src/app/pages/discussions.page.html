<div class="p-4 md:p-8 grid md:grid-cols-12 gap-6">
  <div class="md:col-span-4 space-y-3">
    <div class="flex gap-2">
      <input class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="New discussion title" [ngModel]="newTitle()" (ngModelChange)="newTitle.set($event)" />
      <button class="px-3 py-2 rounded-lg bg-blue-700 text-white text-sm" (click)="createThread()">Create</button>
    </div>
    <ul class="space-y-1 text-sm">
      <li *ngFor="let t of threads()" class="border border-slate-200 rounded-lg px-3 py-2 hover:bg-slate-50 cursor-pointer" (click)="open(t.id)">{{ t.title }}</li>
    </ul>
  </div>
  <div class="md:col-span-8 space-y-4" *ngIf="selected">
    <h2 class="text-lg font-semibold">{{ selected.discussion.title }}</h2>
    <div class="space-y-2">
      <div *ngFor="let p of selected.posts" class="border border-slate-200 rounded-lg px-3 py-2">
        <div class="text-xs text-slate-500">{{ p.userID }}  {{ p.createdAt | date:'short' }}</div>
        <div class="text-sm">{{ p.body }}</div>
      </div>
    </div>
    <div class="flex gap-2">
      <input class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Write a reply" [ngModel]="newPost()" (ngModelChange)="newPost.set($event)" />
      <button class="px-3 py-2 rounded-lg bg-blue-700 text-white text-sm" (click)="post()">Post</button>
    </div>
  </div>
</div>
