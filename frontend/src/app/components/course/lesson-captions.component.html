<div class="rounded-xl border border-slate-200 bg-white p-4 mt-3">
  <div class="flex items-center justify-between">
    <h4 class="text-sm font-semibold">Captions & Transcript</h4>
    <div class="text-xs text-emerald-700" *ngIf="toast()">{{ toast() }}</div>
  </div>
  <div class="mt-3 grid gap-3 md:grid-cols-2">
    <div>
      <label class="block text-xs font-medium text-slate-700 mb-1" for="captionsUrl">Captions file (VTT/SRT)</label>
      <div class="flex items-center gap-2">
        <input id="captionsUrl" class="flex-1 rounded border border-slate-300 px-3 py-2 text-sm" [ngModel]="captionsUrl" (ngModelChange)="captionsUrl=$event" placeholder="https://…/captions.vtt" [disabled]="!canManage" />
        <label class="px-3 py-2 rounded border text-sm cursor-pointer" [class.opacity-50]="!canManage">
          <input type="file" accept=".vtt,.srt,.webvtt,.txt" class="sr-only" (change)="onFileChange($event)" [disabled]="!canManage" />
          Upload
        </label>
        <button class="px-2 py-2 rounded border text-sm" (click)="clearCaptions()" [disabled]="!canManage">Clear</button>
      </div>
      <div class="text-xs text-slate-600 mt-1" *ngIf="captionsUrl">
        <a class="underline text-blue-700" [href]="resolve(captionsUrl)" target="_blank" rel="noopener">Preview captions</a>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-700 mb-1" for="transcript">Transcript (optional)</label>
      <textarea id="transcript" rows="4" class="w-full rounded border border-slate-300 px-3 py-2 text-sm" [ngModel]="transcript" (ngModelChange)="transcript=$event" [disabled]="!canManage" placeholder="Paste full transcript text…"></textarea>
    </div>
  </div>
  <div class="mt-3">
    <button class="px-4 py-2 rounded bg-blue-700 text-white text-sm" (click)="save()" [disabled]="!canManage || saving()">{{ saving() ? 'Saving…' : 'Save captions' }}</button>
  </div>
</div>
